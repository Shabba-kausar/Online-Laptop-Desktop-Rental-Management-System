{% extends 'index.html' %}
{% load static %}
{% block body %}

<!-- Page Header Start -->
    <div class="container-fluid page-header">
        <h1 class="display-3 text-uppercase text-white mb-3">Profile</h1>
        <div class="d-inline-flex text-white">
            <h6 class="text-uppercase m-0"><a class="text-white" href="">Home</a></h6>
            <h6 class="text-body m-0 px-3">/</h6>
            <h6 class="text-uppercase text-body m-0">Profile</h6>
        </div>
    </div>

    <div class="container pb-5">
            <div class="row">
                <div class="col-lg-12">
                    <h2 class="mb-4">PROFILE</h2>
                    <form action="" method="post" enctype="multipart/form-data">
                      {% csrf_token %}
                    <div class="mb-5">
                        <div class="">
                            <div class="col-12 form-group">
                                <label>First name:</label>
                                <input type="text" class="form-control" name="firstname" value="{{data.user.first_name}}">
                            </div>
                            <div class="col-12 form-group">
                                <label>Second Name:</label>
                                <input type="text" class="form-control" name="secondname" value="{{data.user.last_name}}">
                            </div>
                             <div class="col-12 form-group">
                                <label>Email:</label>
                                <input type="email" class="form-control" name="email" value="{{data.user.email}}" readonly>
                            </div>
                             <div class="col-12 form-group">
                                <label>Mobile Number:</label>
                                <input type="text" class="form-control" name="mobile" value="{{data.mobile}}">
                            </div>
                        </div>
                        <button type="submit" class="btn btn-primary" href="">UPDATE</button>
                    </div>
                    </form>
                </div>

            </div>
    </div>
{% endblock %}
