{% extends 'admin_index.html' %}
{% block body %}

<div class="page-content-wrapper">
				<div class="page-content">
					<!--breadcrumb-->
					<div class="page-breadcrumb d-none d-sm-flex align-items-center mb-3">
						<div class="breadcrumb-title pe-3">Forms</div>
						<div class="ps-3">
							<nav aria-label="breadcrumb">
								<ol class="breadcrumb mb-0 p-0">
									<li class="breadcrumb-item"><a href="javascript:;"><i class="bx bx-home-alt"></i></a>
									</li>
									<li class="breadcrumb-item active" aria-current="page">About</li>
								</ol>
							</nav>
						</div>

					</div>
					<!--end breadcrumb-->
					<div class="card radius-15">
						<div class="card-body">
							<form action="" method="post" enctype="multipart/form-data">
								{% csrf_token %}
							<div class="card-title">
								<div class="mb-3 col-6">
									<label class="form-label">Page Title:</label>
									<input type="text" class="form-control" name="pagetitle" value="{{data.pagetitle}}">
								</div>
							</div>
								<div class="form-group">
								<label>Page Description:</label>
									<textarea class="form-control select2bs4" name="description" placeholder="Write you description" style="width: 100%;">{{data.description}}</textarea>
								</div>
								<br>
								<button type="submit" class="btn btn-success">Update</button>
							</form>
						</div>
					</div>
				</div>
			</div>
			<!--end page-content-wrapper-->

		<!--end page-wrapper-->
		<!--start overlay-->
		<div class="overlay toggle-btn-mobile"></div>
		<!--end overlay-->
		<!--Start Back To Top Button--> <a href="javaScript:;" class="back-to-top"><i class='bx bxs-up-arrow-alt'></i></a>
		<!--End Back To Top Button-->
		<!--footer -->
		<div class="footer">
			<p class="mb-0">Syndash @2020 | Developed By : <a href="https://themeforest.net/user/codervent" target="_blank">codervent</a>
			</p>
		</div>
		<!-- end footer -->
	<!-- end wrapper -->

{% endblock %}
