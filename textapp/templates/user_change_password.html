{% extends 'index.html' %}
{% load static %}
{% block body %}

<!-- Page Header Start -->
    <div class="container-fluid page-header">
        <h1 class="display-3 text-uppercase text-white mb-3">Change Password</h1>
        <div class="d-inline-flex text-white">
            <h6 class="text-uppercase m-0"><a class="text-white" href="">Home</a></h6>
            <h6 class="text-body m-0 px-3">/</h6>
            <h6 class="text-uppercase text-body m-0">Change Password</h6>
        </div>
    </div>
    <div class="container pb-5">
        <form action="/user_change_password/" method="post">
				{% csrf_token %}
            <div class="row">
                <div class="col-lg-12">
                    <h2 class="mb-4">CHANGE PASSWORD</h2>
                    <div class="mb-5">
                        <div class="">
                            <div class="col-12 form-group">
                                <label>Current Password:</label>
                                <input type="password" class="form-control" name="pwd3" placeholder="Current Password">
                            </div>
                            <div class="col-12 form-group">
                                <label>New Password:</label>
                                <input type="password" class="form-control" name="pwd2" placeholder="New Password">
                            </div>
                             <div class="col-12 form-group">
                                <label>Confirm Password:</label>
                                <input type="password" class="form-control" name="pwd1" placeholder="Confirm Password">
                            </div>
                        </div>
                        <button type="submit" class="btn btn-primary" href="">SUBMIT</button>
                    </div>
                </div>

            </div>
        </form>
    </div>
{% endblock %}
